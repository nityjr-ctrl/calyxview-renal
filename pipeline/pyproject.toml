[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renalplan"
version = "0.3.0"
description = "3D models and computed nephrometry from kidney and tumour outlines (research and teaching prototype)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22", "trimesh>=4.4",
  "fast-simplification>=0.1.9", "rtree>=1.1", "shapely>=2.0", "nibabel>=5.2", "pydicom>=2.4", "matplotlib>=3.8",
]

[project.optional-dependencies]
ai = ["SimpleITK>=2.3", "Pillow>=10", "TotalSegmentator==2.14.0"]

[project.scripts]
renalplan = "renalplan.cli:main"

[tool.setuptools.packages.find]
include = ["renalplan*"]

[tool.setuptools.package-data]
renalplan = ["review_assets/*.html", "review_assets/*.js", "model_specs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import renalplan from this folder, even when an older copy is pip-installed
# elsewhere, so the tests always run the code they sit next to.
pythonpath = ["."]
