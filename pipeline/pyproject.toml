[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renalplan"
version = "0.1.0"
description = "CT-to-3D reconstruction and planning support for partial nephrectomy (research and teaching prototype)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22", "trimesh>=4.4",
  "fast-simplification>=0.1.9", "rtree>=1.1", "shapely>=2.0", "nibabel>=5.2", "pydicom>=2.4", "matplotlib>=3.8",
]

[project.scripts]
renalplan = "renalplan.cli:main"

[tool.setuptools.packages.find]
include = ["renalplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
